<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Produk — Admin Raufa Digital</title><link rel="stylesheet" href="../css/style.css"><style>.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;background:#fff;border:1px solid #eee2d3;border-radius:18px;padding:22px;margin:22px 0}.admin-form label{display:grid;gap:6px;font-weight:700;font-size:14px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:12px;border:1px solid #e1d5c7;border-radius:10px;background:#fff}.admin-form textarea{min-height:100px}.span-2{grid-column:1/-1}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.table-card button{margin:2px}.tiny{font-size:12px;color:#817568}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.span-2{grid-column:auto}}</style></head><body>
<header class="navbar"><a class="brand" href="dashboard.html"><span class="brand-mark">RD</span><span>Admin <b>Produk</b></span></a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="products.html">Produk</a><a href="pages.html">Halaman</a><a href="members.html">Member</a><a href="orders.html">Pesanan</a></nav><div class="nav-actions"><a class="btn btn-outline" href="../index.html">Website</a><button class="btn btn-outline" data-admin-logout>Keluar</button></div></header>
<main class="section"><div class="page-title"><div class="eyebrow">PANEL ADMIN</div><h1>Kelola Produk</h1><p>Tambah, edit, dan hapus produk di katalog. Perubahan disimpan ke Supabase.</p></div><div id="msg" class="notice" role="status">Memeriksa akses admin…</div>
<form id="productForm" class="admin-form" hidden><input id="productId" type="hidden"><label>Nama produk<input id="name" required maxlength="150" placeholder="Contoh: Paket Worksheet Premium"></label><label>Kategori<input id="category" required maxlength="80" placeholder="Worksheet Anak"></label><label>Ikon / emoji<input id="icon" maxlength="12" value="📚" placeholder="📚"></label><label>Harga (angka)<input id="price" type="number" min="0" step="1" value="0" required></label><label class="span-2">Deskripsi<textarea id="description" maxlength="1500" placeholder="Jelaskan isi produk"></textarea></label><label class="span-2">Link Lynk.id (pembelian)<input id="lynkUrl" type="url" placeholder="https://lynk.id/..."></label><label class="span-2">Link PDF / Google Drive untuk member<input id="memberUrl" type="url" placeholder="https://drive.google.com/..."><small class="tiny">Hanya tombol di website yang dibatasi login. Untuk privasi file sebenarnya, atur Google Drive menjadi Terbatas (Restricted).</small></label><label><span>Produk unggulan</span><select id="featured"><option value="false">Tidak</option><option value="true">Ya</option></select></label><label><span>Status katalog</span><select id="active"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></label><div class="span-2 admin-actions"><button class="btn" id="saveBtn" type="submit">Simpan Produk</button><button class="btn btn-outline" id="cancelEdit" type="button" hidden>Batal Edit</button></div></form>
<div class="admin-actions" style="margin:14px 0"><button id="addBtn" class="btn">＋ Tambah Produk</button><button id="reloadBtn" class="btn btn-outline">Muat Ulang</button></div><div class="table-card"><table><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="productRows"><tr><td colspan="5">Memuat produk…</td></tr></tbody></table></div></main>
<script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/admin-auth.js"></script><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[];
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));}
function message(s,bad=false){$('msg').textContent=s;$('msg').style.background=bad?'#fff0ee':'#f8f0e6';}
function resetForm(){ $('productForm').reset();$('productId').value='';$('icon').value='📚';$('price').value='0';$('featured').value='false';$('active').value='true';$('saveBtn').textContent='Simpan Produk';$('cancelEdit').hidden=true; }
function fillForm(p){$('productId').value=p.id;$('name').value=p.name||'';$('category').value=p.category||'';$('icon').value=p.icon||'📚';$('price').value=p.price||0;$('description').value=p.description||'';$('lynkUrl').value=p.lynk_url||'';$('memberUrl').value=p.member_url||'';$('featured').value=String(!!p.featured);$('active').value=String(p.is_active!==false);$('saveBtn').textContent='Simpan Perubahan';$('cancelEdit').hidden=false;$('productForm').hidden=false;$('productForm').scrollIntoView({behavior:'smooth',block:'start'});}
async function load(){const [{data,error},{data:links, error:linksError}]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),sb.from('product_member_links').select('product_id,member_url')]);if(error){message('Gagal memuat produk: '+error.message,true);return;}if(linksError){message('Jalankan supabase/admin-features.sql terlebih dahulu. '+linksError.message,true);return;}const linkMap=new Map((links||[]).map(x=>[x.product_id,x.member_url]));products=(data||[]).map(p=>({...p,member_url:linkMap.get(p.id)||''}));$('productRows').innerHTML=products.length?products.map(p=>`<tr><td><b>${esc(p.icon||'📚')} ${esc(p.name)}</b><br><small>${esc(p.slug||'')}</small></td><td>${esc(p.category||'—')}</td><td>${money(p.price)}</td><td>${p.is_active?'Aktif':'Nonaktif'}</td><td><div class="admin-actions"><button class="btn btn-outline" data-edit="${esc(p.id)}" type="button">Edit</button><button class="btn btn-outline" data-delete="${esc(p.id)}" type="button">Hapus</button></div></td></tr>`).join(''):'<tr><td colspan="5">Belum ada produk. Klik Tambah Produk.</td></tr>';}
document.addEventListener('DOMContentLoaded',async()=>{if(!window.sb){message('Supabase belum terkoneksi. Periksa js/config.js.',true);return;}const x=await adminUser();if(!x||x.profile?.role!=='admin'){location.href='login.html?error=unauthorized';return;}$('productForm').hidden=true;await load();$('addBtn').onclick=()=>{resetForm();$('productForm').hidden=false;$('productForm').scrollIntoView({behavior:'smooth'});};$('cancelEdit').onclick=()=>{resetForm();$('productForm').hidden=true;};$('reloadBtn').onclick=load;$('productRows').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');const del=e.target.closest('[data-delete]');if(edit){const p=products.find(p=>p.id===edit.dataset.edit);if(p)fillForm(p);}if(del){const p=products.find(p=>p.id===del.dataset.delete);if(!p||!confirm('Hapus produk “'+p.name+'”?'))return;const {error}=await sb.from('products').delete().eq('id',p.id);if(error){message('Tidak dapat menghapus: '+error.message,true);return;}message('Produk berhasil dihapus.');await load();}});$('productForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('name').value.trim();const payload={name,slug:name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6),category:$('category').value.trim(),icon:$('icon').value.trim()||'📚',price:Number($('price').value||0),description:$('description').value.trim(),lynk_url:$('lynkUrl').value.trim()||null,featured:$('featured').value==='true',is_active:$('active').value==='true',updated_at:new Date().toISOString()};const id=$('productId').value;let savedId=id;let result;if(id){delete payload.slug;result=await sb.from('products').update(payload).eq('id',id);}else{result=await sb.from('products').insert(payload).select('id').single();if(!result.error)savedId=result.data.id;}if(result.error){message('Gagal menyimpan: '+result.error.message,true);return;}const memberUrl=$('memberUrl').value.trim();let linkResult;if(memberUrl){linkResult=await sb.from('product_member_links').upsert({product_id:savedId,member_url:memberUrl,updated_at:new Date().toISOString()},{onConflict:'product_id'});}else{linkResult=await sb.from('product_member_links').delete().eq('product_id',savedId);}if(linkResult.error){message('Produk tersimpan, tetapi link member gagal disimpan. Pastikan SQL admin-features.sql sudah dijalankan: '+linkResult.error.message,true);return;}message(id?'Perubahan produk berhasil disimpan.':'Produk baru berhasil ditambahkan.');resetForm();$('productForm').hidden=true;await load();});});
</script></body></html>
