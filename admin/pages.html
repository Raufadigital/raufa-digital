<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Halaman — Admin Raufa Digital</title><link rel="stylesheet" href="../css/style.css"><style>.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#fff;border:1px solid #eee2d3;border-radius:18px;padding:22px;margin:22px 0}.admin-form label{display:grid;gap:6px;font-weight:700}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:12px;border:1px solid #e1d5c7;border-radius:10px}.admin-form textarea{min-height:170px}.span-2{grid-column:1/-1}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.span-2{grid-column:auto}}</style></head><body><header class="navbar"><a class="brand" href="dashboard.html"><span class="brand-mark">RD</span><span>Admin <b>Halaman</b></span></a><nav><a href="dashboard.html">Dashboard</a><a href="products.html">Produk</a><a class="active" href="pages.html">Halaman</a><a href="members.html">Member</a><a href="orders.html">Pesanan</a></nav><div class="nav-actions"><a class="btn btn-outline" href="../index.html">Website</a><button class="btn btn-outline" data-admin-logout>Keluar</button></div></header><main class="section"><div class="page-title"><div class="eyebrow">PANEL ADMIN</div><h1>Kelola Halaman</h1><p>Buat halaman informasi sederhana dan pilih apakah halaman dapat dilihat publik.</p></div><div id="msg" class="notice">Memeriksa akses admin…</div><form id="pageForm" class="admin-form" hidden><input type="hidden" id="pageId"><label>Judul halaman<input id="title" required maxlength="120" placeholder="Contoh: Tentang Raufa Digital"></label><label>Slug / alamat halaman<input id="slug" required pattern="[a-z0-9-]+" placeholder="tentang-raufa-digital"><small>Gunakan huruf kecil, angka, dan tanda hubung.</small></label><label class="span-2">Isi halaman<textarea id="content" required maxlength="12000" placeholder="Tulis isi halaman di sini..."></textarea></label><label>Status halaman<select id="active"><option value="true">Aktif / dapat dibuka publik</option><option value="false">Draft / tidak tampil publik</option></select></label><div class="span-2"><button class="btn" type="submit" id="saveBtn">Simpan Halaman</button> <button class="btn btn-outline" type="button" id="cancelBtn" hidden>Batal</button></div></form><div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0"><button class="btn" id="addBtn">＋ Tambah Halaman</button><button class="btn btn-outline" id="reloadBtn">Muat Ulang</button></div><div class="table-card"><table><thead><tr><th>Halaman</th><th>Status</th><th>Link</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="4">Memuat…</td></tr></tbody></table></div></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/admin-auth.js"></script><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let pages=[];function msg(t,bad=false){$('msg').textContent=t;$('msg').style.background=bad?'#fff0ee':'#f8f0e6';}function reset(){ $('pageForm').reset();$('pageId').value='';$('saveBtn').textContent='Simpan Halaman';$('cancelBtn').hidden=true; }
async function load(){const {data,error}=await sb.from('site_pages').select('*').order('updated_at',{ascending:false});if(error){msg('Gagal memuat halaman. Jalankan supabase/admin-features.sql di SQL Editor terlebih dahulu. '+error.message,true);return;}pages=data||[];$('rows').innerHTML=pages.length?pages.map(p=>`<tr><td><b>${esc(p.title)}</b><br><small>${esc(p.slug)}</small></td><td>${p.is_active?'Aktif':'Draft'}</td><td>${p.is_active?`<a target="_blank" rel="noopener" href="../custom-page.html?slug=${encodeURIComponent(p.slug)}">Buka halaman</a>`:'—'}</td><td><button class="btn btn-outline" data-edit="${esc(p.id)}">Edit</button> <button class="btn btn-outline" data-del="${esc(p.id)}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4">Belum ada halaman. Klik Tambah Halaman.</td></tr>';}
document.addEventListener('DOMContentLoaded',async()=>{if(!window.sb){msg('Supabase belum terkoneksi.',true);return;}const x=await adminUser();if(!x||x.profile?.role!=='admin'){location.href='login.html?error=unauthorized';return;}await load();$('addBtn').onclick=()=>{$('pageForm').hidden=false;reset();$('pageForm').scrollIntoView({behavior:'smooth'});};$('cancelBtn').onclick=()=>{reset();$('pageForm').hidden=true;};$('reloadBtn').onclick=load;$('rows').addEventListener('click',async e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-del]');if(eb){const p=pages.find(p=>p.id===eb.dataset.edit);if(!p)return;$('pageId').value=p.id;$('title').value=p.title;$('slug').value=p.slug;$('content').value=p.content;$('active').value=String(p.is_active);$('saveBtn').textContent='Simpan Perubahan';$('cancelBtn').hidden=false;$('pageForm').hidden=false;$('pageForm').scrollIntoView({behavior:'smooth'});}if(db){const p=pages.find(p=>p.id===db.dataset.del);if(p&&confirm('Hapus halaman '+p.title+'?')){const {error}=await sb.from('site_pages').delete().eq('id',p.id);if(error)msg('Gagal menghapus: '+error.message,true);else{msg('Halaman dihapus.');await load();}}}});$('pageForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('pageId').value;const payload={title:$('title').value.trim(),slug:$('slug').value.trim().toLowerCase(),content:$('content').value.trim(),is_active:$('active').value==='true',updated_at:new Date().toISOString()};const {error}=id?await sb.from('site_pages').update(payload).eq('id',id):await sb.from('site_pages').insert(payload);if(error){msg('Gagal menyimpan: '+error.message,true);return;}msg('Halaman berhasil disimpan.');reset();$('pageForm').hidden=true;await load();});});
</script></body></html>
